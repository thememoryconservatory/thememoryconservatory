# The Memory Conservatory — Netlify configuration

[build]
  command = "npm run build"
  publish = "public"

[build.environment]
  NODE_VERSION = "22"

# Long-cache fingerprint-free static assets. Fonts and images never change
# in place — a new image gets a new filename — so a long max-age is safe.
[[headers]]
  for = "/assets/fonts/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/assets/img/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    X-Frame-Options = "SAMEORIGIN"
    Referrer-Policy = "strict-origin-when-cross-origin"

# ---------------------------------------------------------------------------
# PRE-LAUNCH ONLY — REMOVE THIS BLOCK BEFORE GOING LIVE
# ---------------------------------------------------------------------------
# Keeps the draft site out of Google while the client is reviewing it. This is
# not access control — anyone with the URL can still read the site — it only
# tells search engines not to index or follow it.
#
# Leaving this in place after launch would keep the finished site invisible in
# search results, which for a wedding studio is the whole point of having one.
# See PRELAUNCH-CHECKLIST.md.
[[headers]]
  for = "/*"
  [headers.values]
    X-Robots-Tag = "noindex, nofollow"
