<!-- Testimonials.

     The client asked for these on the home page and at the end of every gallery
     page, so they live in a partial: the reviews exist once, and a gallery page
     adds them with a single include line.

     Every review below is the client's own, verbatim. Mechanical corrections
     only — see PRELAUNCH-CHECKLIST.md for the list.

     Layout follows the reference the client chose (michaelcassara.me): one
     review at a time in a boxed panel, the name set large beneath it, and
     arrows with a counter. No photographs — removed at the client's request.
     In the brand's own colours and faces: Deep Blue ground, Soft Cream type,
     the review in Sorts Mill Goudy italic within double quotes, the name in
     Hanken Grotesk. The reference's per-review headlines are left out — the
     client's reviews do not have any, and we do not invent his copy.

     Without JavaScript every review is shown, stacked — main.js hides all but
     one and adds the controls.

     Usage, on its own line:   @include testimonials   (wrapped in an HTML comment)
-->
<section class="section section--blue" id="testimonials">
  <div class="shell">

    <div style="max-width:var(--container-prose)" class="reveal">
      <p class="eyebrow eyebrow--ruled">Notes from the experiences</p>
      <!-- TODO:CLIENT this heading is ours; the reviews are theirs. -->
      <h2 class="section__title">Client <em>testimonials</em></h2>
    </div>

    <div class="reviews reveal" data-reviews
         role="region" aria-roledescription="carousel" aria-label="Client testimonials">

      <!-- Without JavaScript, show every review in turn rather than one that
           cannot be changed. -->
      <noscript>
        <style>
          .reviews__stage { display: block; }
          .review { visibility: visible; opacity: 1; }
          .review + .review { margin-top: clamp(2rem, 4vw, 3rem); }
        </style>
      </noscript>

      <div class="reviews__stage" data-reviews-stage>
        <figure class="review" data-review id="review-1" role="group"
                aria-roledescription="slide" aria-label="1 of 9" data-active>
          <blockquote class="review__panel">
            <p class="review__label">Testimonials</p>
            <div class="review__body">
              <p>
              &ldquo;I booked The Memory Conservatory team for my wedding. Super friendly
              team! They made us feel relaxed and guided us with poses, which made a
              huge difference. The entire experience was fun and stress free. And they
              didn&rsquo;t just take photos&mdash;they captured feelings. Both the
              photography and videography were exceptional. The wedding film was
              emotional and beautiful, especially thanks to Narayanaswamy and team.&rdquo;
              </p>
            </div>
            <figcaption class="review__by">Hema Gowri</figcaption>
          </blockquote>
        </figure>
        <figure class="review" data-review id="review-2" role="group"
                aria-roledescription="slide" aria-label="2 of 9">
          <blockquote class="review__panel">
            <p class="review__label">Testimonials</p>
            <div class="review__body">
              <p>
              &ldquo;Extremely talented and no nonsense person who will deliver exactly to
              your needs. I am very happy with my brother&rsquo;s marriage album and my
              parents&rsquo; 60th marriage function album. He gives a lot of space and
              time for the bride and groom to settle in which is a rarity among
              photographers. Cost efficiency is another boom. Thanks to the team for
              being very polite and creative catering to all our expectations.
              Professionalism at its best.&rdquo;
              </p>
            </div>
            <figcaption class="review__by">Divya</figcaption>
          </blockquote>
        </figure>
        <figure class="review" data-review id="review-3" role="group"
                aria-roledescription="slide" aria-label="3 of 9">
          <blockquote class="review__panel">
            <p class="review__label">Testimonials</p>
            <div class="review__body">
              <p>
              &ldquo;We had the pleasure of working with The Memory Conservatory for our
              wedding, and he did an outstanding job covering all our events. He was
              incredibly understanding and flexible, ensuring both the bride and groom
              were comfortable throughout the day. His work was exceptional across the
              board, from the pre-wedding shoot to candid shots and the live stream.
              Additionally, he was punctual and professional in every aspect. Highly
              recommended!&rdquo;
              </p>
            </div>
            <figcaption class="review__by">Aakash</figcaption>
          </blockquote>
        </figure>
        <figure class="review" data-review id="review-4" role="group"
                aria-roledescription="slide" aria-label="4 of 9">
          <blockquote class="review__panel">
            <p class="review__label">Testimonials</p>
            <div class="review__body">
              <p>
              &ldquo;We flew in from Canada, and Narayana was incredibly accommodating with
              our schedule and the entire booking process. He was so easy-going and
              made us feel comfortable right away, which made working with him such a
              great experience. He guided us naturally with posing and truly listened
              to our ideas, asking for inspiration and making sure our vision was
              captured. The picture quality and edits were exactly what we were
              looking for&mdash;absolutely beautiful. He was super professional and
              delivered everything within the timeframe he promised. We truly had such
              an amazing experience and couldn&rsquo;t be happier with the results!&rdquo;
              </p>
            </div>
            <figcaption class="review__by">Thiviia</figcaption>
          </blockquote>
        </figure>
        <figure class="review" data-review id="review-5" role="group"
                aria-roledescription="slide" aria-label="5 of 9">
          <blockquote class="review__panel">
            <p class="review__label">Testimonials</p>
            <div class="review__body">
              <p>
              &ldquo;I booked Narayana Swamy to cover photos and videos for my engagement in
              Chennai. His team is very kind, patient, humble and talented. They take
              extreme care about planning for the event and are very accommodative of
              our wishes for the special day. They delivered the photos and videos as
              promised on the correct date and the output is fabulous. I&rsquo;m
              extremely satisfied with his work. I recommend Narayana Swamy and his
              team for all your special events, including weddings.&rdquo;
              </p>
            </div>
            <figcaption class="review__by">Priyanka</figcaption>
          </blockquote>
        </figure>
        <figure class="review" data-review id="review-6" role="group"
                aria-roledescription="slide" aria-label="6 of 9">
          <blockquote class="review__panel">
            <p class="review__label">Testimonials</p>
            <div class="review__body">
              <p>
              &ldquo;We never had any big expectations with the wedding photography&hellip;
              All I said to Narayana Swamy was that this is going to be a celebration
              and I want the photos to radiate that celebration&hellip; Right from the
              pre wedding he made us feel comfortable, he was particular that the
              photos shouldn&rsquo;t be an artificially choreographed one but should
              flow, something that will speak what we naturally are&hellip; He gave us
              that time and never rushed for the sake of completing the shoot&hellip;
              He was very patient and tried to give us the best shots&hellip; When it
              comes to candids, very few photographers capture the moments that you
              know or you would have thought it would be nice if someone captures and
              freezes this particular moment&hellip; Because moments and emotions
              connected with it are very subjective&hellip; The Memory Conservatory is
              one of the fews who does that with his genuine efforts&hellip; His team
              is another bonus&hellip; He and his team reproduce what we exactly
              need&hellip;&rdquo;
              </p>
            </div>
            <figcaption class="review__by">Niveditha</figcaption>
          </blockquote>
        </figure>
        <figure class="review" data-review id="review-7" role="group"
                aria-roledescription="slide" aria-label="7 of 9">
          <blockquote class="review__panel">
            <p class="review__label">Testimonials</p>
            <div class="review__body">
              <p>
              &ldquo;There&rsquo;s something special about looking back at photographs and
              reliving the moments. When it&rsquo;s something as special as your
              wedding that becomes even more apparent. The photos that were taken were
              not only immaculate but it captured the moments perfectly. The
              professionalism was on point and it never felt like a chore being
              photographed. I would highly recommend it!&rdquo;
              </p>
            </div>
            <figcaption class="review__by">Tejas</figcaption>
          </blockquote>
        </figure>
        <figure class="review" data-review id="review-8" role="group"
                aria-roledescription="slide" aria-label="8 of 9">
          <blockquote class="review__panel">
            <p class="review__label">Testimonials</p>
            <div class="review__body">
              <p>
              &ldquo;The TMC team has done a stellar job with the photography for our event!
              We were really happy with what they had delivered, especially with the
              portrait solo and couple shots. The team is very understanding of the
              event timelines and adapt quickly to meet our needs based on the changing
              timelines. All in all, I would definitely recommend it!&rdquo;
              </p>
            </div>
            <figcaption class="review__by">Tarun</figcaption>
          </blockquote>
        </figure>
        <figure class="review" data-review id="review-9" role="group"
                aria-roledescription="slide" aria-label="9 of 9">
          <blockquote class="review__panel">
            <p class="review__label">Testimonials</p>
            <div class="review__body">
              <p>
              &ldquo;Narayana Swamy is a multi-talented, warm and professional gem. A
              must-have for making your special moments immortal. Exceeded all
              expectations! Possesses an innate talent to show up the most outstanding
              shots. You won&rsquo;t ever regret having to call them to capture your
              special moments.&rdquo;
              </p>
            </div>
            <figcaption class="review__by">Shanmuga Raja</figcaption>
          </blockquote>
        </figure>
      </div>

      <!-- Hidden until main.js wires it up: an arrow that does nothing is
           worse than no arrow. -->
      <div class="reviews__nav" data-reviews-nav hidden>
        <button class="reviews__arrow" type="button" data-reviews-prev aria-label="Previous review">
          <svg viewBox="0 0 40 12" fill="none" stroke="currentColor" stroke-width="1" aria-hidden="true">
            <path d="M39 6H1m5-5L1 6l5 5" stroke-linecap="round" stroke-linejoin="round"/>
          </svg>
        </button>
        <p class="reviews__count" aria-live="polite">
          <span data-reviews-current>1</span> / <span data-reviews-total>9</span>
        </p>
        <button class="reviews__arrow" type="button" data-reviews-next aria-label="Next review">
          <svg viewBox="0 0 40 12" fill="none" stroke="currentColor" stroke-width="1" aria-hidden="true">
            <path d="M1 6h38m-5-5 5 5-5 5" stroke-linecap="round" stroke-linejoin="round"/>
          </svg>
        </button>
      </div>

    </div>
  </div>
</section>
