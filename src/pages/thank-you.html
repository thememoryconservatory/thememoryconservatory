<!doctype html>
<html lang="en">
<head>
  <!-- @include head title="Thank You" description="Your enquiry has reached The Memory Conservatory. We will be in touch within 48 hours." -->
  <meta name="robots" content="noindex">
  <noscript>
    <style>.reveal { opacity: 1 !important; transform: none !important; }</style>
  </noscript>
</head>

<body>

  <!-- @include header active="contact" -->

  <main id="main">

    <!-- Where the enquiry form posts on success (form action="/thank-you").
         Without this page Netlify shows its own generic success screen, which
         is the one moment in the journey a couple has just committed to. -->
    <section class="page-hero" aria-label="Enquiry received">
      <!-- TODO:CLIENT stock placeholder — replace with the studio's own work -->
      <img class="page-hero__img" src="https://tmc-gallery.pages.dev/nivedha-x-ajit/full/n-x-a-tmc-15.jpg"
           alt="The bride on the steps of a traditional house"
           style="--focal:50% 45%" fetchpriority="high" decoding="async">

      <div class="page-hero__scrim" aria-hidden="true"></div>
      <div class="hero__grain" aria-hidden="true"></div>

      <div class="shell page-hero__inner">
        <p class="eyebrow eyebrow--ruled">Enquiry Received</p>
        <h1 class="page-hero__title">Thank you for writing to <em>us</em></h1>
      </div>
    </section>

    <section class="section section--white">
      <div class="shell">
        <div class="prose reveal">
          <p>
            Your enquiry has reached us and we will try to get back within 48 hours.
            If you don&rsquo;t hear from us, or if it&rsquo;s a last minute enquiry,
            give us a call on
            <a href="tel:+918438533169">+91&nbsp;84385&nbsp;33169</a>.
          </p>
        </div>

        <p class="reveal" style="margin-top:clamp(2rem,4vw,3rem)">
          <a class="btn btn-blue" href="/">Back to the home page</a>
        </p>
      </div>
    </section>

  </main>

  <!-- @include footer -->

  <script type="module" src="/assets/js/main.js"></script>
</body>
</html>
